[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "avatarcast"
version = "0.4.0"
description = "Audio-first, measurable digital-human video pipeline"
requires-python = ">=3.10"
# numpy + Pillow are core: qa_scorers.py imports them unconditionally.
# Everything else is stdlib, except the optional extras below.
dependencies = [
    "numpy",
    "Pillow",
]

[project.optional-dependencies]
# Real offline Chinese ASR (model itself is NOT bundled; see asr_vosk.py).
asr = ["vosk"]
test = ["pytest"]

[project.scripts]
dhp = "dhp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
