[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "avatarcast"
version = "0.1.0"
description = "Audio-first, measurable digital-human video pipeline"
requires-python = ">=3.10"

[project.scripts]
dhp = "dhp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
