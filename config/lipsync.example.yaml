# Copy to lipsync.yaml and fill in. Never commit a real API key here.
# API key comes from the environment: export WAVESPEED_API_KEY=...
provider: wavespeed-api        # default. Switch to "local" only when that adapter exists.
model: avatar-omni-human-1.5
submit_url: https://api.wavespeed.ai/api/v3/bytedance/avatar-omni-human-1.5
result_url_template: https://api.wavespeed.ai/api/v3/predictions/{id}/result
api_key_env: WAVESPEED_API_KEY
# Fill from the LIVE price beside Generate for your exact input before the
# first run. Leave null until then -- the adapter refuses to submit on a guess.
rate_per_sec: null
poll_interval_sec: 2
timeout_sec: 600
