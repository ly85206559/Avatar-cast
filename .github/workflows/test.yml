name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ffmpeg and Chinese fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fontconfig fonts-noto-cjk
      - name: Install package and test deps
        run: pip install -e ".[test]"
      - name: Run tests
        run: python -m pytest -q
      - name: Run offline demo (no spending, no network models)
        run: dhp demo --out outputs/demo-ci
